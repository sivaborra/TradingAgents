name: Deploy Laya sample demo

on:
  push:
    branches:
      - fix/aggregate-news-providers
    paths:
      - ".github/workflows/deploy-laya-demo.yml"
      - "demo/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Check out the fork
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload static demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
